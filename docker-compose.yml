# Docura production stack: HTTPS via Caddy's internal CA, PostgreSQL,
# Redis, OCR, migrations, web app, worker and scheduled backups.
#
#   cp .env.production.example .env   # then set DOCURA_HOST,
#                                      # BETTER_AUTH_SECRET, POSTGRES_PASSWORD
#   docker compose up -d --build
#
# See README, "Deployment" (also: how .env is used). Development uses
# docker-compose.dev.yml.
name: docura

# app, worker and migrate share one image; only app builds it. Empty values
# (`${X:-}`) fall back to the code defaults.
x-app: &app
  image: ${COMPOSE_PROJECT_NAME:-docura}-app
  # Forwards SIGTERM to bun and reaps children, so `stop` does not time out.
  init: true
  extra_hosts:
    - 'host.docker.internal:host-gateway'
  environment:
    DATABASE_URL: &database-url postgresql://${POSTGRES_USER:-docura}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}@db:5432/${POSTGRES_DB:-docura}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET muss in .env gesetzt sein}
    PASSKEY_RP_ID: ${DOCURA_HOST:?DOCURA_HOST muss in .env gesetzt sein}
    BETTER_AUTH_URL: &public-url ${DOCURA_PUBLIC_URL:-https://${DOCURA_HOST}}
    PASSKEY_ORIGIN: *public-url
    REDIS_URL: redis://redis:6379
    OCR_SERVICE_URL: http://ocr:8100
    UPLOAD_DIR: /data/uploads
    WATCH_DIR: /data/watch
    WATCH_ENABLED: ${WATCH_ENABLED:-}
    MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-}
    # Ollama runs on the Docker host, not in this stack.
    OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-}
    OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
    TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-}
    STALE_JOB_TIMEOUT_MINUTES: ${STALE_JOB_TIMEOUT_MINUTES:-}
    STORAGE_ORPHAN_MIN_AGE_MINUTES: ${STORAGE_ORPHAN_MIN_AGE_MINUTES:-}
    EXPORT_MAX_DOCUMENTS: ${EXPORT_MAX_DOCUMENTS:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    SMTP_FROM: ${SMTP_FROM:-}

# Backup and restore run the bash scripts in the PostgreSQL image, which has
# pg_dump/pg_restore of the server's major version. No .env in /app, so the
# scripts only use the variables below.
x-backup: &backup
  image: pgvector/pgvector:pg18
  working_dir: /app
  environment: &backup-env
    DATABASE_URL: *database-url
    UPLOAD_DIR: /data/uploads
    BACKUP_DIR: /backups
  depends_on:
    db:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    # Ports other than 80/443 are for local testing only (see README).
    ports:
      - '${DOCURA_HTTP_PORT:-80}:80'
      - '${DOCURA_HTTPS_PORT:-443}:443'
    environment:
      DOCURA_HOST: ${DOCURA_HOST}
      # Caddy ignores its own default for an empty variable, so it lives here.
      DOCURA_MAX_BODY_SIZE: ${DOCURA_MAX_BODY_SIZE:-64MB}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Holds the root CA including its private key (root.key): a secret, and
      # losing it means trusting a new CA on every device (see README).
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # 127.0.0.1, not localhost: the admin API does not listen on ::1.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    # Only started, not healthy: the CA download keeps working while app is down.
    depends_on: [app]

  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-docura}
    # The extensions are created by the migrate service.
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  # No volume: Redis only carries the worker heartbeat (TTL) and pub/sub.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  ocr:
    build: ./services/ocr
    restart: unless-stopped
    environment:
      OCR_ENGINE: 'tesseract'
      OCR_TESSERACT_LANG: 'deu'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8100/health']
      interval: 30s
      timeout: 5s
      retries: 3

  # One-shot: runs on every `docker compose up`, so updates migrate on their own.
  migrate:
    <<: *app
    # Built by the app service; never pulled from a registry.
    pull_policy: never
    command: ['bun', 'scripts/migrate.ts']
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    build: .
    restart: unless-stopped
    volumes:
      - uploads:/data/uploads
    healthcheck:
      # The image has no curl or wget.
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:4321/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    pull_policy: never
    restart: unless-stopped
    command: ['bun', 'scripts/worker.ts']
    # On SIGTERM the worker finishes the jobs in flight (OCR up to 120 s plus
    # LLM and embedding calls); whatever is still unfinished after this is
    # reset by the stale-job sweep.
    stop_grace_period: 3m
    volumes:
      - uploads:/data/uploads
      # Scanner/SMB target; must be writable for uid 1000 (see README).
      - ${DOCURA_WATCH_PATH:-./watch}:/data/watch
    healthcheck:
      test: ['CMD', 'bun', 'scripts/worker-health.ts']
      interval: 30s
      timeout: 5s
      retries: 3
      # The heartbeat starts after the database check and the watcher.
      start_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ocr:
        condition: service_started

  # Daily backup at BACKUP_TIME (UTC); runs as root so it can write to any
  # bind mount. Backups are root-owned and owner-only (umask 077).
  backup:
    <<: *backup
    restart: unless-stopped
    command: ['bash', '/app/scripts/backup-loop.sh']
    environment:
      <<: *backup-env
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-14}
      BACKUP_TIME: ${BACKUP_TIME:-}
    volumes:
      - ./scripts:/app/scripts:ro
      - uploads:/data/uploads:ro
      - ${DOCURA_BACKUP_PATH:-./backups}:/backups

  # docker compose run --rm restore /backups/docura-backup-<ts> [--yes --force]
  restore:
    <<: *backup
    profiles: ['restore']
    entrypoint: ['bash', '/app/scripts/restore.sh']
    environment:
      <<: *backup-env
      # Printed after a successful restore instead of the bun commands.
      RESTORE_NEXT_STEPS: |-
        1. docker compose run --rm migrate
        2. docker compose start app worker
        3. docker compose exec app bun run storage:check
    volumes:
      - ./scripts:/app/scripts:ro
      - uploads:/data/uploads
      - ${DOCURA_BACKUP_PATH:-./backups}:/backups:ro

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
