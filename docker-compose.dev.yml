services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: docura-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docura_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-docura}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-docura} -d ${POSTGRES_DB:-docura}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: docura-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  ocr:
    build: ./services/ocr
    container_name: docura-ocr
    restart: unless-stopped
    environment:
      OCR_ENGINE: 'tesseract'
      OCR_TESSERACT_LANG: 'deu'
    ports:
      - '8100:8100'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8100/health']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
